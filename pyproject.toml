[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "talknj"
version = "0.1.0"
description = "Private, offline Windows voice dictation with local Whisper models"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6==6.10.2",
  "faster-whisper==1.2.1",
  "sounddevice==0.5.3",
  "av==16.0.1",
  "ctranslate2==4.6.0",
  "setuptools==80.9.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pyinstaller==6.16.0", "ruff==0.14.1"]

[project.gui-scripts]
talknj = "talknj.app:main"

[tool.setuptools.packages.find]
include = ["talknj*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
